# VERReport CI (GitHub Actions).
# pytest를 지원하는 Python 버전(3.10 이상)에서 돌리고, 샘플 입력으로 리포트가 실제로 생성되는지 확인한다.
# PR은 이 검사를 통과해야 병합한다. 단계가 실패해도 나머지를 끝까지 실행해 결과를 한 번에 보여준다.
name: CI

on:
  push:
    branches: [master, develop, 'feature/**', 'release/**', 'hotfix/**']
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 테스트 (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 설치
        run: python -m pip install -e ".[dev]"

      - name: 단위 테스트 (pytest)
        if: '!cancelled()'
        run: python -m pytest -q

      - name: 샘플 리포트 생성 (CLI 스모크 테스트)
        if: '!cancelled()'
        run: verreport generate -c samples/verreport.yml -o report --build-number "$GITHUB_RUN_NUMBER"

      - name: 샘플 리포트 확인
        if: '!cancelled()'
        run: |
          for f in index gtest coverage cppcheck lizard; do
            test -s "report/$f.html" || { echo "report/$f.html 이 없거나 비어 있음"; exit 1; }
          done
          test -s report/static/chart.umd.min.js

      - name: 샘플 리포트 업로드
        if: ${{ !cancelled() && matrix.python == '3.12' }}
        uses: actions/upload-artifact@v4
        with:
          name: sample-report
          path: report/
          if-no-files-found: ignore
